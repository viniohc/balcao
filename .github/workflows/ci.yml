name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The README asks for Node.js 24.x.
          node-version: 24
          cache: npm
      - run: npm ci
      # Local Vitest suite; Firestore emulator tests are excluded by vitest.config.ts.
      - run: npm test
      # Type-check and build the published demo, as Vercel does.
      - run: npm run build:demo
